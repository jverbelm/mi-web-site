:root {

  --line: #dbe2f7;

  --primary-2: #4f46e5;
  --accent: #f59e0b;
  --success: #087e60;
  --success-bg: #e6f7f0;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #0e1428;
    --surface-2: #17203b;
    --ink: #f1f4ff;
    --muted: #aab4cf;
    --line: #35406a;

    --accent: #fbbf24;
    --success: #78e5bd;

  }

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

.hero-grid {
  background-image: linear-gradient(rgba(255,255,255,.74), rgba(255,255,255,.74)), repeating-linear-gradient(90deg, rgba(36,71,201,.08) 0 1px, transparent 1px 58px), repeating-linear-gradient(0deg, rgba(36,71,201,.08) 0 1px, transparent 1px 58px);
}

.card-hover {
  transition: transform .18s ease, box-shadow .18s ease;
}

.card-hover:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 34px rgba(23,33,68,.14);
}

.line-clamp-3 {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.toast-in {
  animation: toastIn .22s ease-out;
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.modal-in {
  animation: modalIn .2s ease-out;
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(14px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
